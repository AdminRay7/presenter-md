<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>303-XMD | Grey Tech</title>
    <style>
        /* ── GREY TECH GRADIENT BACKGROUND ── */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e24 0%, #2b2b36 50%, #0f0f13 100%);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* ── GLASSMORPHISM CARD ── */
        .card {
            background: rgba(40, 40, 45, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        /* ── GRADIENT TEXT ── */
        h1 {
            background: linear-gradient(90deg, #00ffcc, #0088ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        p {
            color: #9aa0a6;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* ── INPUT STYLING ── */
        input {
            width: 90%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a1f;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        /* ── GRADIENT BUTTON ── */
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #00ffcc, #0088ff);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* ── CODE DISPLAY BOX ── */
        .code-box {
            margin-top: 25px;
            padding: 15px;
            background: #1a1a1f;
            border: 1px dashed #00ffcc;
            border-radius: 8px;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00ffcc;
            display: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* ── FOOTER BRANDING ── */
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #666;
            z-index: 10;
            text-align: center;
        }

        .footer span {
            color: #ff4d4d;
        }

        /* ── GLOWING BACKGROUND ORBS ── */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(0, 255, 204, 0.15);
            top: 10%;
            left: 20%;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(0, 136, 255, 0.1);
            bottom: 10%;
            right: 15%;
        }
    </style>
</head>
<body>

    <!-- Background Glow Effects -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">
        <h1>303-XMD</h1>
        <p>Grey Tech • Secure Linker</p>
        
        <input type="text" id="phone" placeholder="e.g. 254794376595" autocomplete="off">
        
        <button onclick="getCode()">Get Pairing Code</button>
        
        <div id="status"></div>
        <div class="code-box" id="code-display"></div>
    </div>

    <div class="footer">
        303 XMD • Grey Tech<br>
        Made with <span>❤️</span> by Mr Presenter
    </div>

    <script>
        async function getCode() {
            const num = document.getElementById('phone').value;
            const status = document.getElementById('status');
            const codeBox = document.getElementById('code-display');

            if(!num) {
                status.innerText = "Please enter your phone number.";
                status.style.color = "#ffaa00";
                return;
            }

            status.innerText = "Generating code, please wait (up to 30s)...";
            status.style.color = "#ffaa00";
            codeBox.style.display = "none";

            try {
                const res = await fetch(`/api/pair?num=${num}`);
                const data = await res.json();

                if(data.code) {
                    status.innerText = "Code generated! Enter it in WhatsApp > Linked Devices.";
                    status.style.color = "#00ff00";
                    codeBox.innerText = data.code;
                    codeBox.style.display = "block";
                } else {
                    status.innerText = data.error || "Failed to get code.";
                    status.style.color = "#ff0000";
                }
            } catch (err) {
                status.innerText = "Server error. Please try again.";
                status.style.color = "#ff0000";
            }
        }
    </script>
</body>
</html>
