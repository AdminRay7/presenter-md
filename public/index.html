<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>303-XMD | Grey Tech</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-dark: #09090b;
            --bg-card: #121215;
            --primary: #00ffcc;
            --primary-dim: #00cc9f;
            --accent: #0088ff;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 136, 255, 0.05), transparent 25%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Live Status Dot */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 204, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 15px;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(0, 255, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.1);
            background: rgba(0,0,0,0.4);
        }

        .input-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
        }

        .input-group input:focus + svg {
            fill: var(--primary);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(0, 255, 204, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: var(--border);
            color: var(--text-muted);
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Alert Boxes */
        .alert {
            display: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 20px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fcd34d;
        }

        .alert-success {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.2);
            color: var(--primary);
        }

        /* Code Display */
        .code-container {
            display: none;
            margin-top: 25px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .code-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .code-box {
            background: rgba(0,0,0,0.3);
            border: 1px dashed var(--primary);
            padding: 20px;
            border-radius: 12px;
            font-size: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--primary);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            user-select: none;
        }

        .code-box:hover {
            background: rgba(0, 255, 204, 0.05);
        }

        .code-box .copy-hint {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .code-box:hover .copy-hint {
            color: var(--text-main);
        }

        /* Steps / FAQ */
        .steps {
            margin-top: 25px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .step-item {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .step-number {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .footer span { color: var(--danger); }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <h1>303-XMD</h1>
            <p>Grey Tech • Secure Linker</p>
            <div class="status-pill" id="server-status">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">Connecting...</span>
            </div>
        </div>

        <div class="card">
            <div class="input-group">
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="e.g. 254794376595" 
                    autocomplete="off" 
                    inputmode="numeric" 
                    maxlength="15" 
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                >
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
            </div>

            <button id="pairBtn" onclick="getCode()">
                <span class="spinner" id="btn-spinner"></span>
                <span id="btn-text">Get Pairing Code</span>
            </button>

            <!-- Status Alerts -->
            <div id="alert-error" class="alert alert-error"></div>
            <div id="alert-warning" class="alert alert-warning"></div>
            <div id="alert-success" class="alert alert-success"></div>

            <!-- Code Display -->
            <div class="code-container" id="code-container">
                <div class="code-label">Your Pairing Code</div>
                <div class="code-box" id="code-box" onclick="copyCode()">
                    <span id="code-text">----</span>
                    <div class="copy-hint">Tap to copy</div>
                </div>
            </div>

            <!-- Steps -->
            <div class="steps">
                <div class="step-item">
                    <div class="step-number">1</div>
                    <div>Open WhatsApp on your phone and go to <b>Settings</b>.</div>
                </div>
                <div class="step-item">
                    <div class="step-number">2</div>
                    <div>Tap <b>Linked Devices</b> and select <b>Link a Device</b>.</div>
                </div>
                <div class="step-item">
                    <div class="step-number">3</div>
                    <div>Select <b>Link with phone number</b> and enter the code above.</div>
                </div>
            </div>
        </div>

        <div class="footer">
            303 XMD • Grey Tech<br>
            Made with <span>❤️</span> by Mr Presenter
        </div>
    </div>

    <script>
        const phoneInput = document.getElementById('phone');
        const pairBtn    = document.getElementById('pairBtn');
        const btnText    = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const codeContainer = document.getElementById('code-container');
        const codeText   = document.getElementById('code-text');
        const statusDot  = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        
        const alertError = document.getElementById('alert-error');
        const alertWarning = document.getElementById('alert-warning');
        const alertSuccess = document.getElementById('alert-success');

        let countdownTimer = null;

        // Server Ping Check on Load
        async function checkServer() {
            try {
                const res = await fetch('/health');
                if (res.ok) {
                    statusDot.style.backgroundColor = 'var(--primary)';
                    statusText.innerText = 'System Online';
                    statusText.style.color = 'var(--primary)';
                } else throw new Error();
            } catch {
                statusDot.style.backgroundColor = 'var(--danger)';
                statusText.innerText = 'System Offline';
                statusText.style.color = 'var(--danger)';
            }
        }
        checkServer();

        function hideAlerts() {
            alertError.style.display = 'none';
            alertWarning.style.display = 'none';
            alertSuccess.style.display = 'none';
        }

        function showAlert(type, msg) {
            hideAlerts();
            if (type === 'error') {
                alertError.innerText = msg;
                alertError.style.display = 'block';
            } else if (type === 'warning') {
                alertWarning.innerText = msg;
                alertWarning.style.display = 'block';
            } else if (type === 'success') {
                alertSuccess.innerText = msg;
                alertSuccess.style.display = 'block';
            }
        }

        function setLoading(isLoading) {
            pairBtn.disabled = isLoading;
            phoneInput.disabled = isLoading;
            if (isLoading) {
                btnSpinner.style.display = 'block';
                btnText.innerText = 'Generating...';
            } else {
                btnSpinner.style.display = 'none';
                btnText.innerText = 'Get Pairing Code';
            }
        }

        async function getCode() {
            const num = phoneInput.value.trim();
            hideAlerts();

            if (!num) {
                showAlert('warning', 'Please enter your phone number.');
                return;
            }
            if (num.length < 10 || num.length > 15) {
                showAlert('warning', 'Phone number must be 10–15 digits.');
                return;
            }

            codeContainer.style.display = 'none';
            setLoading(true);

            try {
                const res = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: "main", num })
                });

                if (res.status === 429) {
                    const data = await res.json().catch(() => ({}));
                    return startCountdown(data.error || "Too many attempts. Please wait.");
                }

                const data = await res.json().catch(() => ({}));

                if (res.ok && data.code) {
                    showAlert('success', 'Code generated successfully!');
                    codeText.innerText = data.code;
                    codeContainer.style.display = 'block';
                } else {
                    showAlert('error', data.error || 'Failed to get code.');
                }
            } catch (err) {
                showAlert('error', 'Server error. Please try again.');
            } finally {
                setLoading(false);
            }
        }

        async function copyCode() {
            const code = codeText.innerText;
            if (!code || code === '----') return;
            
            try {
                await navigator.clipboard.writeText(code);
                const hint = document.querySelector('.copy-hint');
                const originalText = hint.innerText;
                
                hint.innerText = "✅ Copied!";
                hint.style.color = "var(--primary)";
                
                setTimeout(() => { 
                    hint.innerText = originalText; 
                    hint.style.color = "var(--text-muted)";
                }, 2000);
            } catch {
                // Fallback
                const range = document.createRange();
                range.selectNodeContents(codeText);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        function startCountdown(message) {
            if (countdownTimer) clearInterval(countdownTimer);
            let remaining = 60;
            setLoading(true);
            
            const tick = () => {
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    setLoading(false);
                    showAlert('success', 'You can try again now.');
                    return;
                }
                showAlert('warning', `⏳ ${message} (${remaining}s)`);
                remaining--;
            };
            tick();
            countdownTimer = setInterval(tick, 1000);
        }

        phoneInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !pairBtn.disabled) getCode();
        });
    </script>
</body>
</html>
